# corvid's name in the cluster is .test only; older suffixes that never
# resolved anywhere are not inherited. the shape is one pod with two
# doors: kingfisher's service answers corvid's hostname as well as its
# own, and the base file carries the reason.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: corvid
spec:
  routes:
    - match: Host(`corvid.test`)
      kind: Rule
      services:
        - name: kingfisher
          port: 15021
