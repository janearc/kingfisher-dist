# corvid's own name, pointing at the service that serves it.
#
# corvid is a page, not a daemon -- kingfisher serves the built viewer out of
# its root. But "refer to services by name" applies to the thing a person opens,
# not only to the process behind it, and corvid.localhost is what somebody will
# type. Without this the dodo row has to name kingfisher to reach corvid, which
# is true and useless.
#
# Same Service, second hostname. No second pod, no second copy of anything.
#
# WHY THIS LIVES IN KINGFISHER, WHICH IS BACKWARDS. A service should not own a
# consumer's hostname, and this one does. It stays here because corvid has no
# kube/ of its own -- nothing at its root, only tooling/distill-valhalla/kube --
# so moving this file means inventing a kustomization over there, on a branch
# that has not landed yet. That trade is not worth making today.
#
# THE EXIT: the day corvid grows a kube/ of its own, this file moves, and the
# change is one git mv plus a line removed from each kustomization.yaml. Nothing
# else here depends on it. Until then the rule is stated rather than obeyed, on
# purpose, and this comment is the record of that choice.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: corvid
  namespace: fleet
  labels:
    app.kubernetes.io/name: corvid
    app.kubernetes.io/part-of: fleet
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`corvid.localhost`) || Host(`corvid.local`) || Host(`corvid.mesh`)
      services:
        - kind: Service
          name: kingfisher
          port: 15021
          passHostHeader: true
